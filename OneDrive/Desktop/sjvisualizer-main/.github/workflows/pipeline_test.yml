name: Pipeline Validation

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Lint with black
        run: |
          pip install black
          black --check . || true

      - name: Run dry-run test
        run: |
          python pipeline.py
        env:
          TTS_ENGINE: edge

      - name: Check audio output
        run: |
          test -f audio/narration.mp3 || echo "Warning: narration not generated"
          test -f audio/background_music.mp3 || echo "Warning: background music not fetched"

      - name: Check logs
        run: |
          if [ -f logs/pipeline_*.log ]; then
            cat logs/pipeline_*.log | tail -20
          fi
