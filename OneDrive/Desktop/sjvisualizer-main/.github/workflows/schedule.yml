name: Daily Pipeline

on:
  schedule:
    # Runs at 08:00 UTC every day (adjust to your preferred time)
    - cron: '0 8 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google Sheets credentials
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials.json

      - name: Write YouTube client secrets
        if: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON != '' }}
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > youtube_client_secrets.json

      - name: Write YouTube token
        if: ${{ secrets.YOUTUBE_TOKEN_JSON != '' }}
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube_token.json

      - name: Run pipeline (with virtual display for tkinter)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python pipeline.py
        env:
          DISPLAY: ':99'
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

      - name: Upload output videos as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            output/*.mp4
            logs/*.log
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          if ls logs/pipeline_*.log 1>/dev/null 2>&1; then
            cat logs/pipeline_*.log | tail -50
          fi
